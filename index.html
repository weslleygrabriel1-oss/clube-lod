<!DOCTYPE html>
<html>
<head>
<title>🛡️ Clube LOD</title>

<style>
body{
background:linear-gradient(180deg,#0a0a0a,#1b0033);
color:white;
font-family:Arial;
text-align:center;
margin:0;
padding:20px;
}

.logo{
width:250px;
border-radius:20px;
box-shadow:0 0 30px #a020f0;
}

.caixa{
background:rgba(0,0,0,0.7);
padding:20px;
margin:20px auto;
width:80%;
border-radius:20px;
border:2px solid #7d2cff;
box-shadow:0 0 15px #7d2cff;
}

h1{
color:gold;
text-shadow:0 0 10px gold;
}

.contador{
font-size:40px;
font-weight:bold;
color:#00e5ff;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#7d2cff;
padding:10px;
}

td{
padding:10px;
border-bottom:1px solid #444;
}
</style>
</head>

<body>

<img src="logo.png" class="logo">

<h1>⚠️ META DOS 200 MIL ⚠️</h1>

<div class="caixa">
<h2>🏆 Clube LOD</h2>
<p>Meta mínima: <b>200.000 pontos</b></p>
<p>Quem não cumprir poderá ser removido do clube.</p>
</div>

<div class="caixa">
<h2>⏳ Contagem Regressiva</h2>
<div class="contador">
    <div id="contador">9d 0h 00m</div>
</div>

<script>
let tempo = 9 * 24 * 60 * 60;

setInterval(function(){
    let dias = Math.floor(tempo / 86400);
    let horas = Math.floor((tempo % 86400) / 3600);
    let minutos = Math.floor((tempo % 3600) / 60);

    document.getElementById("contador").innerHTML =
    dias + "d " + horas + "h " + minutos + "m";

    if(tempo > 0){
        tempo--;
    }
}, 1000);
</script>
</div>
</div>

<div class="caixa">
<h2>📢 Avisos do ADM</h2>
<p>Nenhum aviso no momento.</p>
</div>

<div class="caixa">
<h2>🏅 Ranking Temporada Passada</h2>

<table>
<tr>
<th>Posição</th>
<th>Jogador</th>
<th>Título</th>
</tr>

<tr>
<td>🥇</td>
<td>Weslley</td>
<td>👑 Campeão</td>
</tr>

</table>

</div>

</body>
</html>
